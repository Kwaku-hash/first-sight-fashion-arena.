<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First Sight Fashion Arena</title>
<meta name="description" content="First Sight Fashion Arena: watches, shoes, sneakers, suits, perfumes, jewelry and more. Everything for dressing.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&display=swap">
<style>
:root{--bg:#faf8f5;--card:#fff;--text:#1d1b19;--muted:#7a746c;--gold:#9a7b4f;--line:#e8e3dc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
header{background:#14120f;color:#f5efe6;text-align:center;padding:56px 20px 44px}
h1{margin:0;font-family:"Playfair Display",Georgia,serif;font-weight:500;font-size:clamp(28px,7vw,54px);letter-spacing:5px;text-transform:uppercase}
header p{margin:12px 0 0;color:#cdb68c;letter-spacing:3px;text-transform:uppercase;font-size:13px}
.bar{max-width:1050px;margin:0 auto;padding:22px 16px 6px}
#q{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:99px;font-size:16px;background:var(--card);color:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--text);font-size:14px;cursor:pointer}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
main{max-width:1050px;margin:0 auto;padding:14px 16px 60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;font-size:72px;background:linear-gradient(135deg,#efe7da,#d9c9ad)}
.pic img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.cat{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.name{font-weight:600}
.price{color:var(--gold);font-weight:700;font-size:18px}
.buy{margin-top:auto;padding-top:10px}
.buy a{display:block;text-align:center;background:#14120f;color:#f5efe6;text-decoration:none;padding:10px;border-radius:8px;font-size:15px}
.none{text-align:center;color:var(--muted);padding:50px 0;display:none}
footer{text-align:center;padding:30px 16px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>First Sight Fashion Arena</h1>
  <p>Everything for dressing</p>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search watches, suits, perfumes...">
  <div class="chips" id="chips"></div>
</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="none" id="none">Nothing found. Try another search.</div>
</main>
<footer>&copy; First Sight Fashion Arena. Contact us on WhatsApp to order.</footer>

<script>
/* ===== EDIT HERE =====
   1. Put your WhatsApp number (country code, no + or spaces).
   2. Edit the ITEMS list. To use a real photo, add img:"photos/name.jpg"
      and put the file in a "photos" folder next to this file. */
const WHATSAPP = "+233201786734";
const ICONS = {"Watches":"⌚","Sneakers":"👟","Shoes":"👞","Boots":"🥾","Suits":"🤵","Perfumes":"🧴","Jewelry":"💍","Shirts":"👔","Belts":"🎗️","Designer Wear":"👗"};
const ITEMS = [
  {name:"Classic Gold Chronograph Watch", cat:"Watches", price:"$120"},
  {name:"Silver Steel Automatic Watch", cat:"Watches", price:"$185"},
  {name:"Leather Strap Minimalist Watch", cat:"Watches", price:"$75"},
  {name:"White Low-Top Sneakers", cat:"Sneakers", price:"$65"},
  {name:"Street Runner Sneakers", cat:"Sneakers", price:"$80"},
  {name:"Oxford Leather Shoes", cat:"Shoes", price:"$95"},
  {name:"Suede Loafers", cat:"Shoes", price:"$70"},
  {name:"Timberland Classic Wheat Boots", cat:"Boots", price:"$150"},
  {name:"Timberland Black Ankle Boots", cat:"Boots", price:"$140"},
  {name:"Navy Two-Piece Suit", cat:"Suits", price:"$220"},
  {name:"Charcoal Slim-Fit Suit", cat:"Suits", price:"$240"},
  {name:"Oud Night Perfume 100ml", cat:"Perfumes", price:"$55"},
  {name:"Fresh Citrus Cologne 100ml", cat:"Perfumes", price:"$45"},
  {name:"Gold Plated Chain Necklace", cat:"Jewelry", price:"$40"},
  {name:"Pearl Drop Earrings", cat:"Jewelry", price:"$30"},
  {name:"Crisp White Dress Shirt", cat:"Shirts", price:"$35"},
  {name:"Printed Short-Sleeve Shirt", cat:"Shirts", price:"$28"},
  {name:"Genuine Leather Belt", cat:"Belts", price:"$25"},
  {name:"Reversible Buckle Belt", cat:"Belts", price:"$30"},
  {name:"Tailored Evening Dress", cat:"Designer Wear", price:"$130"},
  {name:"Embroidered Traditional Set", cat:"Designer Wear", price:"$110"}
];
/* ===== END EDIT ===== */

let cat="All";
const $=id=>document.getElementById(id);
function chips(){
  const c=$("chips");c.textContent="";
  ["All",...new Set(ITEMS.map(i=>i.cat))].forEach(k=>{
    const b=document.createElement("button");
    b.className="chip"+(k===cat?" on":"");b.textContent=k;
    b.onclick=()=>{cat=k;chips();show()};c.append(b);
  });
}
function show(){
  const q=$("q").value.toLowerCase().trim(),g=$("grid");g.textContent="";
  const list=ITEMS.filter(i=>(cat==="All"||i.cat===cat)&&(i.name+" "+i.cat).toLowerCase().includes(q));
  $("none").style.display=list.length?"none":"block";
  list.forEach(i=>{
    const c=document.createElement("div");c.className="card";
    const p=document.createElement("div");p.className="pic";
    if(i.img){const im=document.createElement("img");im.src=i.img;im.alt=i.name;im.loading="lazy";p.append(im)}
    else p.textContent=ICONS[i.cat]||"🛍️";
    const f=document.createElement("div");f.className="info";
    const a=document.createElement("div");a.className="cat";a.textContent=i.cat;
    const n=document.createElement("div");n.className="name";n.textContent=i.name;
    const pr=document.createElement("div");pr.className="price";pr.textContent=i.price;
    const b=document.createElement("div");b.className="buy";
    const l=document.createElement("a");l.textContent="Order on WhatsApp";l.target="_blank";l.rel="noopener";
    l.href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello, I want to order: "+i.name+" ("+i.price+")");
    b.append(l);f.append(a,n,pr,b);c.append(p,f);g.append(c);
  });
}
$("q").oninput=show;
chips();show();
</script>
</body>
</html>
